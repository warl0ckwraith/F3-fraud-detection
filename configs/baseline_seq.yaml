seed: 42
device: cpu

data:
  dataset_path: data/synthetic/mvp_v1.jsonl
  seq_len: 10
  batch_size: 128
  val_split: 0.15
  test_split: 0.15
  split_strategy: time

model:
  use_graph: false
  sequence_encoder:
    input_size: 2
    hidden_size: 32
    num_layers: 1
    bidirectional: false
    dropout: 0.0
  graph_encoder:
    out_dim: 32
    hidden_dim: 32
    num_layers: 2
    heads: 2
    temporal_dim: 8
    dropout: 0.1
    time_attr: timestamp
  fusion_head:
    hidden_dims: [64, 32]
    dropout: 0.1

optim:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 5
  lr_schedule:
    enabled: false
  early_stopping:
    enabled: false

loss:
  weighting: var
  alpha: 0.95
  lambda_risk: 1.0

metrics:
  recall_at: 0.05

results:
  enabled: true
  dir: runs
  name: baseline_seq
